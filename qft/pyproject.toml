[project]
name = "qft"
version = "0.1.0"
description = "Quantum Fourier Transform price-prediction exercise (Qiskit)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
    "numpy>=1.24",
]

[project.scripts]
qft = "qft.main:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
